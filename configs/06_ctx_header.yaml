name: 06_ctx_header
parser: pymupdf
chunking:
  strategy: section_table
  chunk_size: 512
  overlap: 64
  contextual_header: true
embedding: {provider: openai, model: text-embedding-3-small}
retrieval:
  mode: hybrid
  top_k: 5
  candidate_k: 30
  metadata_filter: true
rerank: {enabled: true, model: BAAI/bge-reranker-base}
llm: {provider: openai, model: gpt-4.1-mini, temperature: 0.0, max_tokens: 600}
